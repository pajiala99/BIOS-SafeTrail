name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      # conftest.py blanks the Prune keys and uses a throwaway SQLite file, so no AI
      # call leaves the runner; the weather test fakes Open-Meteo.
      - name: Tests
        run: python -m pytest -q

  frontend:
    name: Frontend (vitest, type check, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the key check below scans every commit
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Type check and build
        run: npm run build
      - name: No direct AI calls or committed keys (files, git history, built bundle)
        working-directory: .
        run: python3 scripts/check_no_direct_calls.py
